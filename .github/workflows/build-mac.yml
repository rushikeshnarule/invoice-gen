name: Build macOS & Windows Desktop Apps

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS DMG & Universal Binary
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Package macOS Applications (DMG & Zip)
        run: npx electron-builder --mac dmg zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Invoice-Gen-macOS-DMG
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip

  build-windows:
    name: Build Windows Installer (NSIS)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build & Package Windows Installer
        run: npm run package:exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Invoice-Gen-Windows
          path: dist-electron/Invoice-Gen-Setup-*.exe
